<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#e8f1f8"/>
  
  <!-- Header with Title -->
  <rect x="0" y="0" width="1024" height="80" fill="#2073ac"/>
  <text x="512" y="35" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Effectiveness of screening and ultra-brief alcohol intervention in primary care:
  </text>
  <text x="512" y="65" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">
    a pragmatic cluster randomised controlled trial
  </text>
  
  <!-- Summary Section -->
  <rect x="30" y="100" width="964" height="130" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Summary Icon -->
  <text x="60" y="140" font-family="Arial" font-size="30" font-weight="bold" fill="#2073ac">❝</text>
  
  <text x="100" y="140" font-family="Arial" font-size="22" font-weight="bold" fill="#2073ac">
    <tspan x="100" y="140">Summary</tspan>
  </text>
  
  <!-- Primary Outcome Box -->
  <rect x="100" y="160" width="400" height="50" rx="5" ry="5" fill="#f0f7fc" stroke="#2073ac" stroke-width="1"/>
  
  <!-- No significant difference icon -->
  <line x1="120" y1="185" x2="140" y2="185" stroke="#e74c3c" stroke-width="3"/>
  <text x="160" y="190" font-family="Arial" font-size="16" font-weight="bold" fill="#e74c3c">No difference</text>
  
  <text x="300" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">
    in alcohol consumption at 24 weeks
  </text>
  
  <!-- Secondary Outcome Box -->
  <rect x="520" y="160" width="400" height="50" rx="5" ry="5" fill="#f0f7fc" stroke="#2073ac" stroke-width="1"/>
  
  <!-- Significant improvement icon -->
  <line x1="540" y1="185" x2="560" y2="185" stroke="#27ae60" stroke-width="3"/>
  <text x="580" y="190" font-family="Arial" font-size="16" font-weight="bold" fill="#27ae60">Improvement</text>
  
  <text x="720" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">
    in motivation to change drinking habits
  </text>
  
  <!-- Study Design Section -->
  <rect x="30" y="250" width="964" height="100" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Study Design Icon -->
  <text x="60" y="290" font-family="Arial" font-size="24" font-weight="bold" fill="#2073ac">📋</text>
  
  <text x="100" y="290" font-family="Arial" font-size="22" font-weight="bold" fill="#2073ac">
    <tspan x="100" y="290">Study design</tspan>
  </text>
  
  <!-- Study Design Content -->
  <text x="100" y="330" font-family="Arial" font-size="14" fill="#2C3E50">
    <tspan x="100" y="330">Design: Pragmatic cluster RCT | Randomisation: Clinic-level | Concealment, blinding: No concealment, participant-blinded</tspan>
  </text>
  
  <!-- Population Section -->
  <rect x="30" y="370" width="964" height="100" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Population Icon -->
  <text x="60" y="410" font-family="Arial" font-size="24" font-weight="bold" fill="#2073ac">👥</text>
  
  <text x="100" y="410" font-family="Arial" font-size="22" font-weight="bold" fill="#2073ac">
    <tspan x="100" y="410">Population</tspan>
  </text>
  
  <!-- Population Content -->
  <text x="100" y="450" font-family="Arial" font-size="14" fill="#2C3E50">
    <tspan x="100" y="450">40 primary care clinics in Japan | Outpatients with AUDIT-C ≥ 5 for men & ≥4 for women | 1,133 participants (Ultra-BI n=531, SAO n=602)</tspan>
  </text>
  
  <!-- Comparison Section -->
  <rect x="30" y="490" width="964" height="220" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Comparison Icon -->
  <text x="60" y="530" font-family="Arial" font-size="24" font-weight="bold" fill="#2073ac">⚖️</text>
  
  <text x="100" y="530" font-family="Arial" font-size="22" font-weight="bold" fill="#2073ac">
    <tspan x="100" y="530">Comparison</tspan>
  </text>
  
  <!-- Ultra-BI Group -->
  <rect x="100" y="550" width="400" height="140" rx="5" ry="5" fill="#27ae60" stroke="#cccccc" stroke-width="1"/>
  <text x="300" y="575" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Ultra-BI</text>
  
  <!-- Ultra-BI Icon -->
  <circle cx="140" cy="595" r="20" fill="#ffffff"/>
  <text x="140" y="602" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#27ae60">👨‍⚕️</text>
  
  <!-- Ultra-BI Image Placeholder -->
  <rect x="170" y="580" width="300" height="90" fill="#ffffff" opacity="0.8" stroke="#27ae60" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="320" y="625" font-family="Arial" font-size="14" text-anchor="middle" fill="#27ae60">
    <tspan x="320" y="625">[Ultra-BI Image Placeholder]</tspan>
  </text>
  <text x="320" y="645" font-family="Arial" font-size="12" text-anchor="middle" fill="#27ae60">
    <tspan x="320" y="645">AUDIT screening + brief oral advice + leaflet</tspan>
  </text>
  
  <!-- SAO Group -->
  <rect x="520" y="550" width="400" height="140" rx="5" ry="5" fill="#e67e22" stroke="#cccccc" stroke-width="1"/>
  <text x="720" y="575" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">SAO</text>
  
  <!-- SAO Icon -->
  <circle cx="560" cy="595" r="20" fill="#ffffff"/>
  <text x="560" y="602" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#e67e22">📝</text>
  
  <text x="720" y="625" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">
    <tspan x="720" y="625">AUDIT-C screening only</tspan>
  </text>
  
  <!-- Outcomes Section -->
  <rect x="30" y="730" width="964" height="270" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Outcomes Icon -->
  <text x="60" y="770" font-family="Arial" font-size="24" font-weight="bold" fill="#2073ac">📊</text>
  
  <text x="100" y="770" font-family="Arial" font-size="22" font-weight="bold" fill="#2073ac">
    <tspan x="100" y="770">Outcomes</tspan>
  </text>
  
  <!-- Primary Outcome -->
  <text x="100" y="800" font-family="Arial" font-size="16" font-weight="bold" fill="#2C3E50">
    <tspan x="100" y="800">Primary: Total Alcohol Consumption (24 weeks)</tspan>
  </text>
  
  <!-- Primary Outcome Graph Placeholder -->
  <rect x="100" y="820" width="350" height="160" fill="#f0f7fc" stroke="#2073ac" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="275" y="900" font-family="Arial" font-size="16" text-anchor="middle" fill="#2073ac">
    <tspan x="275" y="900">[Primary Outcome Graph Placeholder]</tspan>
  </text>
  
  <!-- Secondary Outcome -->
  <text x="550" y="800" font-family="Arial" font-size="16" font-weight="bold" fill="#2C3E50">
    <tspan x="550" y="800">Secondary: Readiness to Change (24 weeks)</tspan>
  </text>
  
  <!-- Secondary Outcome Graph Placeholder -->
  <rect x="550" y="820" width="350" height="160" fill="#f0f7fc" stroke="#2073ac" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="725" y="900" font-family="Arial" font-size="16" text-anchor="middle" fill="#2073ac">
    <tspan x="725" y="900">[Secondary Outcome Graph Placeholder]</tspan>
  </text>
  
  <!-- Footer -->
  <text x="512" y="1020" font-family="Arial" font-size="12" text-anchor="middle" fill="#2C3E50">
    Ryuhei So, et al. | medRxiv 2024.12.27.24319613
  </text>
</svg>
