<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#ffffff"/>
  
  <!-- BMJ Header -->
  <rect x="0" y="0" width="1024" height="60" fill="#2073ac"/>
  <text x="20" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="#ffffff">the bmj</text>
  <text x="150" y="40" font-family="Arial" font-size="24" fill="#ffffff">Visual abstract</text>
  
  <!-- Title -->
  <text x="512" y="100" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Effectiveness of screening and ultra-brief alcohol intervention in primary care
  </text>
  <text x="512" y="130" font-family="Arial" font-size="18" text-anchor="middle" fill="#2C3E50">
    A pragmatic cluster randomised controlled trial
  </text>
  
  <!-- Summary Section -->
  <rect x="40" y="160" width="944" height="100" rx="5" ry="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="70" y="190" font-family="Arial" font-size="20" font-weight="bold" fill="#2073ac">
    <tspan x="70" y="190">Summary</tspan>
  </text>
  <text x="70" y="220" font-family="Arial" font-size="16" fill="#2C3E50">
    <tspan x="70" y="220">Ultra-brief intervention (Ultra-BI) improved motivation to change drinking habits</tspan>
    <tspan x="70" y="245">but did not significantly reduce alcohol consumption compared to simplified assessment only (SAO)</tspan>
  </text>
  
  <!-- Study Design Section -->
  <rect x="40" y="280" width="944" height="100" rx="5" ry="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="70" y="310" font-family="Arial" font-size="20" font-weight="bold" fill="#2073ac">
    <tspan x="70" y="310">Study design</tspan>
  </text>
  <text x="70" y="340" font-family="Arial" font-size="16" fill="#2C3E50">
    <tspan x="70" y="340">Pragmatic cluster randomised controlled trial</tspan>
    <tspan x="70" y="365">40 primary care clinics in Japan</tspan>
  </text>
  
  <!-- Population Section -->
  <rect x="40" y="400" width="944" height="100" rx="5" ry="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="70" y="430" font-family="Arial" font-size="20" font-weight="bold" fill="#2073ac">
    <tspan x="70" y="430">Population</tspan>
  </text>
  <text x="70" y="460" font-family="Arial" font-size="16" fill="#2C3E50">
    <tspan x="70" y="460">1,133 outpatients with hazardous drinking (AUDIT-C ≥5 for men, ≥4 for women)</tspan>
    <tspan x="70" y="485">Ultra-BI: n=531 | SAO: n=602</tspan>
  </text>
  
  <!-- Comparison Section -->
  <rect x="40" y="520" width="944" height="160" rx="5" ry="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="70" y="550" font-family="Arial" font-size="20" font-weight="bold" fill="#2073ac">
    <tspan x="70" y="550">Comparison</tspan>
  </text>
  
  <!-- Ultra-BI Group -->
  <rect x="70" y="570" width="400" height="90" rx="5" ry="5" fill="#16A085" stroke="#cccccc" stroke-width="1"/>
  <text x="270" y="600" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Ultra-BI</text>
  <text x="270" y="630" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">AUDIT screening + brief oral advice</text>
  <text x="270" y="650" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">+ alcohol reduction leaflet</text>
  
  <!-- SAO Group -->
  <rect x="550" y="570" width="400" height="90" rx="5" ry="5" fill="#F39C12" stroke="#cccccc" stroke-width="1"/>
  <text x="750" y="600" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">SAO</text>
  <text x="750" y="630" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Simplified assessment only</text>
  <text x="750" y="650" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">(AUDIT-C screening)</text>
  
  <!-- Outcomes Section -->
  <rect x="40" y="700" width="944" height="240" rx="5" ry="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="70" y="730" font-family="Arial" font-size="20" font-weight="bold" fill="#2073ac">
    <tspan x="70" y="730">Outcomes</tspan>
  </text>
  
  <!-- Primary Outcome -->
  <text x="70" y="760" font-family="Arial" font-size="16" font-weight="bold" fill="#2C3E50">
    <tspan x="70" y="760">Primary: Total Alcohol Consumption (24 weeks)</tspan>
  </text>
  
  <!-- Bar Chart for Primary Outcome -->
  <rect x="100" y="780" width="150" height="120" fill="#16A085"/>
  <rect x="300" y="780" width="150" height="117" fill="#F39C12"/>
  
  <text x="175" y="920" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">Ultra-BI</text>
  <text x="175" y="940" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">1046.9g/4 weeks</text>
  
  <text x="375" y="920" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">SAO</text>
  <text x="375" y="940" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">1019.0g/4 weeks</text>
  
  <text x="250" y="970" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">Difference: 27.8g/4 weeks (95% CI -149.7 to 205.4)</text>
  <text x="250" y="990" font-family="Arial" font-size="14" text-anchor="middle" fill="#2C3E50">Bayes factor: 0.08±0.25 (strongly supporting null hypothesis)</text>
  
  <!-- Secondary Outcome -->
  <text x="600" y="760" font-family="Arial" font-size="16" font-weight="bold" fill="#2C3E50">
    <tspan x="600" y="760">Secondary: Readiness to Change</tspan>
  </text>
  
  <!-- Secondary Outcome Results -->
  <text x="600" y="790" font-family="Arial" font-size="14" fill="#16A085" font-weight="bold">
    <tspan x="600" y="790">Significant improvement</tspan>
  </text>
  <text x="600" y="820" font-family="Arial" font-size="14" fill="#2C3E50">
    <tspan x="600" y="820">12 weeks: difference 0.30 (95% CI 0.10 to 0.40)</tspan>
    <tspan x="600" y="845">Hedge's g 0.21 (95% CI 0.10 to 0.33)</tspan>
  </text>
  <text x="600" y="880" font-family="Arial" font-size="14" fill="#2C3E50">
    <tspan x="600" y="880">24 weeks: difference 0.20 (95% CI 0.10 to 0.30)</tspan>
    <tspan x="600" y="905">Hedge's g 0.16 (95% CI 0.05 to 0.28)</tspan>
  </text>
  
  <!-- Footer -->
  <text x="512" y="1000" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Conclusion: Ultra-BI improves motivation to change but not actual alcohol consumption
  </text>
  <text x="512" y="1020" font-family="Arial" font-size="12" text-anchor="middle" fill="#2C3E50">
    Ryuhei So, et al. | medRxiv 2024.12.27.24319613
  </text>
</svg>
